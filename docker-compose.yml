services:

  # ── Milvus стек ──────────────────────────────────────────────────────────────

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rl_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    restart: unless-stopped
    networks:
      - russian_laws_network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rl_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    networks:
      - russian_laws_network

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: rl_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - russian_laws_network

  # ── Приложение ────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: russian_laws_backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY_ROUTER=${API_KEY_ROUTER}
      - MILVUS_URI=http://milvus:19530
      - ARTICLES_PATH=data/processed/articles_parsed.csv
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/mlruns:/app/mlruns
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    networks:
      - russian_laws_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: russian_laws_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - russian_laws_network

networks:
  russian_laws_network:
    driver: bridge

volumes:
  etcd_data:
  minio_data:
  milvus_data:
