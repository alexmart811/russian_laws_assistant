# Конфигурация для RAG метрик (собственная реализация)

# Включение RAG метрик
enabled: true

# Настройки LLM для judge (faithfulness)
llm:
  model: qwen/qwen3.5-flash
  api_key: ${oc.env:API_KEY_ROUTER}
  base_url: https://api.vsellm.ru/v1
  temperature: 0.0
  max_tokens: 4096

# Модель для embeddings (answer relevance)
embedding_model: openai/text-embedding-3-small
