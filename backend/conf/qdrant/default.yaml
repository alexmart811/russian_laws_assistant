# Конфигурация для подключения к Qdrant
url: ${oc.env:QDRANT_URL}
api_key: ${oc.env:QDRANT_API_KEY}

# Настройки коллекции
collection_name: legal_docs_hybrid
vector_size: 1024 # multilingual-e5-large dimension
distance: Cosine

# Гибридный поиск
hybrid:
  enabled: true
  fusion_strategy: union_rerank # weighted_sum или union_rerank
  alpha: 0.5 # Вес комбинирования для weighted_sum (0.5 = баланс dense/sparse)
  sparse_modifier: idf # BM25-подобное взвешивание
  candidates_per_method: 3 # Top-k для каждого метода при union_rerank

# Параметры индексации
on_disk: false
hnsw_config:
  m: 16
  ef_construct: 100

# Параметры поиска
search:
  limit: 10
  score_threshold: 0.5
